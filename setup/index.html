<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install - Web Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f4fa 0%, #e9eef5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(156, 180, 204, 0.2);
            max-width: 720px;
            width: 100%;
            padding: 2.8rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 3rem;
            font-weight: 650;
            color: #0a1a2b;
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1::after {
            content: "β";
            font-size: 1rem;
            font-weight: 400;
            background: #2b6eb0;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            opacity: 0.9;
        }
        .desc {
            font-size: 1.2rem;
            color: #2b4a6e;
            margin-bottom: 2rem;
            padding-left: 1.2rem;
            background: linear-gradient(to right, rgba(43, 110, 176, 0.03), transparent);
            line-height: 1.5;
            font-weight: 350;
            border-left: 4px solid #2b6eb0;
            border-radius: 0 4px 4px 0;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 2rem 0 2rem;
        }
        .feature {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 0.5rem 1.4rem;
            border: 1px solid rgba(70, 120, 170, 0.25);
            color: #1e3a5f;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .action-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin: 1.8rem 0 1rem;
        }
        .btn-install {
            background: #1e3a5f;
            border: none;
            padding: 0.9rem 2.6rem;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            border: 1px solid #2f5380;
            transition: all 0.15s ease;
            min-width: 160px;
            box-shadow: 0 8px 16px -8px rgba(20, 50, 80, 0.4);
        }
        .btn-install:hover {
            background: #143250;
            transform: scale(1.01);
            border-color: #537caa;
            box-shadow: 0 12px 20px -10px #1e3a5f;
        }
        .btn-copy {
            background: transparent;
            border: 1px solid #8ba5c2;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 480;
            color: #1e3a5f;
            cursor: pointer;
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.15s;
            min-width: 140px;
        }
        .btn-copy:hover {
            background: white;
            border-color: #2b6eb0;
            color: #0b1f33;
            box-shadow: 0 8px 18px -8px rgba(43, 110, 176, 0.3);
        }
        .footer-note {
            margin-top: 2rem;
            color: #577594;
            font-size: 0.85rem;
            border-top: 1px dashed rgba(80, 120, 160, 0.3);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pill {
            background: rgba(43, 110, 176, 0.06);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid rgba(43, 110, 176, 0.15);
            color: #1e4b77;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Web Loader</h1>
        <div class="desc">A Light and Free Component</div>
        <div class="features">
            <span class="feature">⚡ Instant Response</span>
            <span class="feature">🔒 Local Execution</span>
            <span class="feature">🧩 No Dependency</span>
        </div>
        <div class="action-group">
            <button class="btn-install" onclick="window.location.href='webblocker.user.js'">⬇️ Install</button>
            <button class="btn-copy" id="copyLinkBtn">🔗 Copy Link</button>
        </div>
        <div class="footer-note">
            <span>© 2025 · Web Loader</span>
            <span class="pill">v1.0.2</span>
        </div>
    </div>
    <script>
        document.getElementById('copyLinkBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const linkToCopy = 'https://example.com/webloader';
            const tempInput = document.createElement('input');
            tempInput.value = linkToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            const originalText = e.target.textContent;
            e.target.textContent = '✅ Copied!';
            setTimeout(() => {
                e.target.textContent = originalText;
            }, 2000);
        });
    </script>
</body>
</html>
