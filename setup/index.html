<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install - Web Loader</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
        body{min-height:100vh;width:100%;background:linear-gradient(145deg,#f0f4fa,#e9eef5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
        h1{font-size:1.8rem;font-weight:600;color:#0a1a2b;margin-bottom:0.5rem;display:flex;align-items:center;gap:6px}
        h1:after{content:"β";font-size:0.8rem;background:#2b6eb0;color:#fff;padding:0.1rem 0.6rem;border-radius:20px}
        .desc{font-size:0.95rem;color:#2b4a6e;margin-bottom:1.5rem;padding-left:0.8rem;border-left:3px solid #2b6eb0;background:linear-gradient(90deg,rgba(43,110,176,0.03),transparent);line-height:1.4;max-width:420px;text-align:center;margin-left:auto;margin-right:auto}
        .feature-box{border:1px solid rgba(70,120,170,0.2);border-radius:12px;margin:1.5rem 0;overflow:hidden;max-width:420px;width:100%}
        .f-item{display:flex;align-items:center;padding:0.6rem 1.2rem;gap:0.6rem}
        .f-item .e{font-size:1rem;width:1.8rem;text-align:center}
        .f-item .t{font-size:0.9rem;color:#1e3a5f}
        .action-group{display:flex;gap:0.8rem;margin:1.2rem 0;max-width:420px;width:100%}
        .action-group button{flex:1;padding:0.7rem 0;border-radius:8px;font-size:1rem;font-weight:500;cursor:pointer;transition:all 0.2s;border:none}
        .btn-install{background:#1e3a5f;color:#fff;box-shadow:0 4px 8px rgba(30,58,95,0.15)}
        .btn-install:hover{background:#143250;transform:translateY(-1px)}
        .btn-copy{background:#f8fafc;border:1px solid #8ba5c2;color:#1e3a5f}
        .btn-copy:hover{background:#fff;border-color:#2b6eb0;transform:translateY(-1px)}
        .footer-note{margin-top:1.5rem;color:#577594;font-size:0.75rem;border-top:1px dashed rgba(80,120,160,0.2);padding-top:1rem;display:flex;justify-content:space-between;align-items:center;max-width:420px;width:100%}
        .pill{background:rgba(43,110,176,0.06);padding:0.15rem 0.8rem;border-radius:20px;font-size:0.7rem;border:1px solid rgba(43,110,176,0.1);color:#1e4b77}
    </style>
</head>
<body>
    <h1>Web Loader</h1>
    <div class="desc">A Light and Free Component</div>
    <div class="feature-box">
        <div class="f-item"><span class="e">⚡</span><span class="t">Instant Response</span></div>
        <div class="f-item"><span class="e">🔒</span><span class="t">Local Execution</span></div>
        <div class="f-item"><span class="e">🧩</span><span class="t">No Dependency</span></div>
    </div>
    <div class="action-group">
        <button class="btn-install" onclick="window.location.href='webblocker.user.js'">⬇️ Install</button>
        <button class="btn-copy" id="copyLinkBtn">🔗 Copy Link</button>
    </div>
    <div class="footer-note">
        <span>© 2025 · Web Loader</span>
        <span class="pill">v1.0.2</span>
    </div>
<script>
document.getElementById('copyLinkBtn').addEventListener('click',(e)=>{
    e.preventDefault();
    const link='extension://fcmfnpggmnlmfebfghbfnillijihnkoh/options.html#url=&nav=dashboard';
    navigator.clipboard.writeText(link).then(()=>{
        const orig=e.target.innerText;
        e.target.innerText='✅ Copied!';
        setTimeout(()=>e.target.innerText=orig,2000);
    });
});
</script>
</body>
</html>
