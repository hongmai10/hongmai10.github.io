<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install - Web Loader</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
        body{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(145deg,#f0f4fa,#e9eef5);margin:0}
        .card{width:100%;background:rgba(255,255,255,0.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:2.5rem 3rem;flex:1;display:flex;flex-direction:column;justify-content:center}
        h1{font-size:3rem;font-weight:650;color:#0a1a2b;margin-bottom:0.3rem;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
        h1:after{content:"β";font-size:1rem;font-weight:400;background:#2b6eb0;color:#fff;padding:0.2rem 0.8rem;border-radius:40px;opacity:0.9}
        .desc{font-size:1.2rem;color:#2b4a6e;margin-bottom:2rem;padding-left:1.2rem;border-left:4px solid #2b6eb0;background:linear-gradient(90deg,rgba(43,110,176,0.03),transparent);line-height:1.5;font-weight:350}
        .feature-box{border:1px solid rgba(70,120,170,0.35);border-radius:28px;margin:2rem 0;overflow:hidden}
        .f-item{display:flex;align-items:center;padding:0.9rem 2rem;gap:0.8rem}
        .f-item .e{font-size:1.4rem;width:2.2rem;text-align:center}
        .f-item .t{font-size:1.1rem;color:#1e3a5f;font-weight:420}
        .action-group{display:flex;justify-content:flex-end;gap:1.2rem;margin:1.8rem 0 1rem}
        .action-group button{flex:1 1 0;min-width:170px;padding:0.9rem 0.2rem;border-radius:60px;font-size:1.2rem;font-weight:500;cursor:pointer;transition:all 0.2s cubic-bezier(0.18,0.89,0.32,1.28);text-align:center;will-change:transform,box-shadow}
        .btn-install{background:#1e3a5f;color:#fff;border:1px solid #2f5380;box-shadow:0 4px 10px -4px rgba(30,58,95,0.3)}
        .btn-install:hover{background:#143250;border-color:#537caa;transform:translateY(-2px) scale(1.02);box-shadow:0 12px 20px -10px #1e3a5f}
        .btn-copy{background:rgba(255,255,255,0.7);border:1px solid #8ba5c2;color:#1e3a5f;box-shadow:0 4px 8px -4px rgba(0,0,0,0.02)}
        .btn-copy:hover{background:#fff;border-color:#2b6eb0;transform:translateY(-2px) scale(1.02);box-shadow:0 12px 20px -10px #2b6eb0}
        .footer-note{margin-top:2rem;color:#577594;font-size:0.85rem;border-top:1px dashed rgba(80,120,160,0.3);padding-top:1.5rem;display:flex;justify-content:space-between;align-items:center}
        .pill{background:rgba(43,110,176,0.06);padding:0.2rem 1rem;border-radius:30px;font-size:0.8rem;border:1px solid rgba(43,110,176,0.15);color:#1e4b77}
    </style>
</head>
<body>
<div class="card">
    <h1>Web Loader</h1>
    <div class="desc">A Light and Free Component</div>
    
    <div class="feature-box">
        <div class="f-item"><span class="e">⚡</span><span class="t">Instant Response</span></div>
        <div class="f-item"><span class="e">🔒</span><span class="t">Local Execution</span></div>
        <div class="f-item"><span class="e">🧩</span><span class="t">No Dependency</span></div>
    </div>

    <div class="action-group">
        <button class="btn-install" onclick="window.location.href='webblocker.user.js'">⬇️ Install</button>
        <button class="btn-copy" id="copyLinkBtn">🔗 Copy Link</button>
    </div>

    <div class="footer-note">
        <span>© 2025 · Web Loader</span>
        <span class="pill">v1.0.2</span>
    </div>
</div>

<script>
document.getElementById('copyLinkBtn').addEventListener('click', (e) => {
    e.preventDefault();
    const link = 'extension://fcmfnpggmnlmfebfghbfnillijihnkoh/options.html#url=&nav=dashboard';
    const inp = document.createElement('input');
    inp.value = link;
    document.body.appendChild(inp);
    inp.select();
    document.execCommand('copy');
    document.body.removeChild(inp);
    const orig = e.target.innerText;
    e.target.innerText = '✅ Copied!';
    setTimeout(() => e.target.innerText = orig, 2000);
});
</script>
</body>
</html>
