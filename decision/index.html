<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=yes">
        <script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>
        <style>
            input { font-size: medium; padding: 3px; margin-top: 3px; }
            hr { width: 350px; }
        </style>
        <title>随机抽取学号</title>
    </head>
    <body style="font-size: large;">
        <div style="text-align: center; margin-left: auto; margin-right: auto; max-width: 80%;">
            <h1 style="font-size: xx-large;">随机抽取学号</h1>
            <div style="margin-top:  0px;"><span style="display: inline-block; width: 150px; text-align: right;">最小值（包括）：</span><input type="text" id="minval_input" value="1"></div>
            <div style="margin-top: 10px;"><span style="display: inline-block; width: 150px; text-align: right;">最大值（包括）：</span><input type="text" id="maxval_input" value="50"></div>
            <div style="margin-top: 10px;"><span style="display: inline-block; width: 150px; text-align: right;">单次抽取数量 ： </span><input type="text" id="numcnt_input" value="1"></div>
            <div style="margin-top: 10px; font-size: small;">单次抽取数量应不高于 20。</div>
            <hr>
            <div style="font-size: medium; margin-top: 10px;" id="specify_title">
                为个别学号调整概率
            </div>
            <div id="specify_form">
                <div style="margin-top: 20px;">指定的学号：<input type="text" id="specified_id"></div>
                <div style="margin-top: 10px;">概率调整到：<input type="text" id="specified_pr"></div>
                <p style="font-size: small;">
                    多个指定的学号请用空格分开<br/>概率为0到1之间的小数<br/>不指定时两字段应均为空
                </p>
            </div>
            <hr style="margin-top: 10px;">
            <h3 id="number_display" style="height: max-content;">学号</h3>
            <button id="get_number" style="margin-top: 10px; padding: 5px 10px; font-size: large;">抽取</button>
            <div style="font-size: small; font-style: italic; margin-top: 10px;">Made for Hongmai10 class. version 1.0.0.</div>
        </div>

        <script>
            const EXCLUDED_NUMBERS = [36, 45];
            const LOW_PROBABILITY_NUMBER = 17;
            const LOW_PROBABILITY_RATE = 0.3;
            
            function getRandom(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function validateRange(value, min, max, name) {
                const num = parseInt(value);
                if (isNaN(num) || num < min || num > max) {
                    alert(`${name}必须在${min}到${max}之间`);
                    return false;
                }
                return num;
            }

            $(function() {
                if (localStorage.getItem("minval") && localStorage.getItem("maxval")) {
                    $("#minval_input").val(localStorage.getItem("minval"));
                    $("#maxval_input").val(localStorage.getItem("maxval"));
                }
            });

            $("#get_number").click(function() {
                const min = validateRange($("#minval_input").val(), 1, 100, "最小值");
                const max = validateRange($("#maxval_input").val(), 1, 100, "最大值");
                if (min === false || max === false) return;
                
                if (min > max) {
                    alert("最小值不能大于最大值");
                    return;
                }

                const count = validateRange($("#numcnt_input").val(), 1, 20, "抽取数量");
                if (count === false) return;

                let available = [];
                for (let i = min; i <= max; i++) {
                    if (!EXCLUDED_NUMBERS.includes(i)) available.push(i);
                }
                
                if (available.length === 0) {
                    alert("当前范围内没有可抽取的学号");
                    return;
                }

                const specIds = $("#specified_id").val().trim();
                const specProb = $("#specified_pr").val().trim();
                let specList = [];
                let probability = 0;

                if (specIds || specProb) {
                    if (!specIds || !specProb) {
                        alert("指定学号和概率必须同时填写");
                        return;
                    }

                    specList = specIds.split(/\s+/).map(Number).filter(n => 
                        !isNaN(n) && n >= min && n <= max && !EXCLUDED_NUMBERS.includes(n)
                    );
                    
                    if (specList.length === 0) {
                        alert("指定的学号无效或不在范围内");
                        return;
                    }

                    probability = parseFloat(specProb);
                    if (isNaN(probability) || probability < 0 || probability > 1) {
                        alert("概率必须是0到1之间的小数");
                        return;
                    }

                    const normalList = available.filter(n => !specList.includes(n));
                    if (normalList.length === 0) {
                        alert("不能指定所有可用学号");
                        return;
                    }
                }

                localStorage.setItem("minval", min);
                localStorage.setItem("maxval", max);

                let results = [];

                const is17Specified = specList.includes(LOW_PROBABILITY_NUMBER);

                let normalNumbers = [];
                let lowProbabilityNumbers = [];
                
                for (let i = min; i <= max; i++) {
                    if (EXCLUDED_NUMBERS.includes(i)) continue;

                    if (i === LOW_PROBABILITY_NUMBER && i >= min && i <= max && !is17Specified) {
                        lowProbabilityNumbers.push(i);
                    } else {
                        normalNumbers.push(i);
                    }
                }

                if (normalNumbers.length === 0 && lowProbabilityNumbers.length > 0) {
                    normalNumbers = lowProbabilityNumbers;
                    lowProbabilityNumbers = [];
                }

                const userSpecifiedNumbers = specList;

                const normalAvailable = normalNumbers.filter(n => 
                    !userSpecifiedNumbers.includes(n) || 
                    (n === LOW_PROBABILITY_NUMBER && lowProbabilityNumbers.length > 0)
                );
                
                for (let i = 0; i < count; i++) {
                    if (userSpecifiedNumbers.length > 0 && Math.random() < probability) {
                        results.push(userSpecifiedNumbers[getRandom(0, userSpecifiedNumbers.length - 1)]);
                    } 
                    else if (lowProbabilityNumbers.length > 0 && Math.random() < LOW_PROBABILITY_RATE) {
                        results.push(LOW_PROBABILITY_NUMBER);
                    } 
                    else {
                        results.push(normalAvailable[getRandom(0, normalAvailable.length - 1)]);
                    }
                }

                $("#number_display").text(results.join(" "));
            });
        </script>
    </body>
</html>
