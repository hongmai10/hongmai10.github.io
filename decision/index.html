<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>
    <style>input{font-size:medium;padding:3px;margin-top:3px;}hr{width:350px;}</style>
    <title>随机抽取学号</title>
</head>
<body style="font-size:large;">
<div style="text-align:center;margin:auto;max-width:80%;">
    <h1 style="font-size:xx-large;">随机抽取学号</h1>
    <div><span style="display:inline-block;width:150px;text-align:right;">最小值（包括）：</span><input type="text" id="minval_input"></div>
    <div style="margin-top:10px;"><span style="display:inline-block;width:150px;text-align:right;">最大值（包括）：</span><input type="text" id="maxval_input"></div>
    <div style="margin-top:10px;"><span style="display:inline-block;width:150px;text-align:right;">单次抽取数量：</span><input type="text" id="numcnt_input" value="1"></div>
    <div style="margin-top:10px;font-size:small;">单次抽取数量应不高于20。</div>
    <hr>
    <div style="font-size:medium;margin-top:10px;" id="specify_title">为个别学号调整概率</div>
    <div id="specify_form">
        <div style="margin-top:20px;">指定的学号：<input type="text" id="specified_id"></div>
        <div style="margin-top:10px;">概率调整到：<input type="text" id="specified_pr"></div>
        <p style="font-size:small;">多个指定的学号请用空格分开<br/>“概率调整到”字段请填入0到1之间的小数</p>
    </div>
    <hr style="margin-top:10px;">
    <h3 id="number_display" style="height:max-content;">学号</h3>
    <button id="get_number" style="margin-top:10px;padding:5px 10px;font-size:large;">抽取</button>
    <div style="font-size:small;font-style:italic;margin-top:10px;">Made for Hongmai10 Class. version 1.0.1.</div>
</div>

<script>
$(function(){
    if(localStorage.getItem("minval")&&localStorage.getItem("maxval")){
        $("#minval_input").val(localStorage.getItem("minval"));
        $("#maxval_input").val(localStorage.getItem("maxval"));
    }
    
    $("#get_number").click(function(){
        var min=$("#minval_input").val(), max=$("#maxval_input").val(), cnt=$("#numcnt_input").val();
        var spe=$("#specified_id").val(), pr=$("#specified_pr").val();
        
        if(!/^\d+$/.test(min)||!parseInt(min)||parseInt(min)<1){alert("最小值应为1-50的正整数");return;}
        if(!/^\d+$/.test(max)||!parseInt(max)||parseInt(max)>50){alert("最大值应为1-50的正整数");return;}
        if(!/^\d+$/.test(cnt)||parseInt(cnt)<1||parseInt(cnt)>20){alert("抽取数量应为1-20");return;}
        
        min=parseInt(min); max=parseInt(max); cnt=parseInt(cnt);
        if(min>max){alert("最大值不能小于最小值");return;}
        
        var spList=[], spPr=0, hasSp=false;
        if(spe.trim()!=""||pr.trim()!=""){
            hasSp=true;
            if(!/^[\d\s]+$/.test(spe)){alert("指定学号格式错误");return;}
            if(!/^\d+(\.\d+)?$/.test(pr)){alert("概率格式错误");return;}
            spPr=parseFloat(pr);
            if(spPr<0||spPr>1){alert("概率应在0-1之间");return;}
            spe.split(" ").forEach(function(v){if(v)spList.push(parseInt(v));});
            spList.forEach(function(v){if(v<min||v>max){alert("指定学号超出范围");throw"stop";}});
        }
        
        var result=[];
        for(var i=0;i<cnt;i++){
            var randNum;
            if(hasSp&&Math.random()<spPr){
                randNum=spList[Math.floor(Math.random()*spList.length)];
            }else{
                do{
                    randNum=Math.floor(Math.random()*(max-min+1))+min;
                }while(hasSp&&spList.indexOf(randNum)!=-1);
            }
            result.push(randNum);
        }
        
        $("#number_display").text(result.join(" "));
        localStorage.setItem("minval",min);
        localStorage.setItem("maxval",max);
    });
});
</script>
</body>
</html>
