<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽学号</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            overflow: hidden;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .result-area {
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            border-radius: 15px;
            border: 3px dashed #6c757d;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .current-number {
            font-size: 8rem;
            font-weight: 800;
            color: #2575fc;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.1);
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .drawing {
            animation: pulse 0.5s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .draw-btn {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
        }
        
        .draw-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .reset-btn {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
        }
        
        .reset-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .history-container {
            width: 100%;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .history-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .history-number {
            background-color: #3498db;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        }
        
        .history-number.current {
            background-color: #e74c3c;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.7);
        }
        
        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        
        .settings label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 1rem;
            color: #2c3e50;
        }
        
        .counter {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-top: 15px;
            font-weight: 600;
        }
        
        .range-info {
            background-color: #f1f8ff;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .current-number {
                font-size: 6rem;
                height: 140px;
            }
            
            .button-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机抽同学学号</h1>
        <p class="subtitle">抽号范围：1-50号（不可调整）</p>
        
        <div class="result-area">
            <div id="currentNumber" class="current-number">?</div>
            <div class="counter">已抽取：<span id="drawCount">0</span> 次</div>
        </div>
        
        <div class="range-info">抽号范围固定为 1-50 号，无法调整</div>
        
        <div class="button-container">
            <button id="drawButton" class="btn draw-btn">随机抽取学号</button>
            <button id="resetButton" class="btn reset-btn">重置抽取记录</button>
        </div>
        
        <div class="settings">
            <label>
                <input type="checkbox" id="avoidRepeat" checked>
                避免重复抽取（直到所有号码被抽完）
            </label>
        </div>
        
        <div class="history-container">
            <h3 class="history-title">已抽取号码记录</h3>
            <div id="historyList" class="history-list">
                <div class="empty-history">暂无抽取记录</div>
            </div>
        </div>
    </div>

    <script>
        // 初始化变量
        let drawCount = 0;
        let drawnNumbers = [];
        let allNumbers = Array.from({length: 50}, (_, i) => i + 1); // 生成1-50的数组
        let remainingNumbers = [...allNumbers];
        const avoidRepeatCheckbox = document.getElementById('avoidRepeat');
        
        // DOM元素
        const currentNumberElement = document.getElementById('currentNumber');
        const drawCountElement = document.getElementById('drawCount');
        const historyListElement = document.getElementById('historyList');
        const drawButton = document.getElementById('drawButton');
        const resetButton = document.getElementById('resetButton');
        
        // 随机抽取学号函数
        function drawRandomNumber() {
            // 检查是否还有剩余号码（如果避免重复模式开启）
            if (avoidRepeatCheckbox.checked && remainingNumbers.length === 0) {
                alert("所有1-50号都已抽取完毕！请重置后再继续抽取。");
                return;
            }
            
            // 添加抽取动画
            currentNumberElement.textContent = "???";
            currentNumberElement.classList.add('drawing');
            
            // 模拟随机抽取过程
            setTimeout(() => {
                let randomNumber;
                
                if (avoidRepeatCheckbox.checked) {
                    // 避免重复模式：从剩余号码中随机抽取
                    const randomIndex = Math.floor(Math.random() * remainingNumbers.length);
                    randomNumber = remainingNumbers[randomIndex];
                    
                    // 从剩余号码中移除已抽取的号码
                    remainingNumbers.splice(randomIndex, 1);
                } else {
                    // 允许重复模式：从1-50中随机抽取
                    randomNumber = Math.floor(Math.random() * 50) + 1;
                }
                
                // 显示抽取结果
                currentNumberElement.textContent = randomNumber;
                currentNumberElement.classList.remove('drawing');
                
                // 添加到已抽取记录
                if (!drawnNumbers.includes(randomNumber) || !avoidRepeatCheckbox.checked) {
                    drawnNumbers.push(randomNumber);
                }
                
                // 更新抽取次数
                drawCount++;
                drawCountElement.textContent = drawCount;
                
                // 更新历史记录显示
                updateHistoryDisplay();
            }, 500);
        }
        
        // 更新历史记录显示
        function updateHistoryDisplay() {
            historyListElement.innerHTML = '';
            
            if (drawnNumbers.length === 0) {
                historyListElement.innerHTML = '<div class="empty-history">暂无抽取记录</div>';
                return;
            }
            
            // 显示最近抽取的号码（最多显示30个）
            const displayNumbers = drawnNumbers.slice(-30);
            
            displayNumbers.forEach((number, index) => {
                const numberElement = document.createElement('div');
                numberElement.className = 'history-number';
                
                // 如果是最新抽取的号码，添加特殊样式
                if (index === displayNumbers.length - 1) {
                    numberElement.classList.add('current');
                }
                
                numberElement.textContent = number;
                historyListElement.appendChild(numberElement);
            });
        }
        
        // 重置抽取记录
        function resetDrawHistory() {
            if (drawnNumbers.length === 0) {
                alert("当前没有抽取记录可重置！");
                return;
            }
            
            if (confirm("确定要重置所有抽取记录吗？")) {
                drawnNumbers = [];
                remainingNumbers = [...allNumbers];
                drawCount = 0;
                currentNumberElement.textContent = "?";
                drawCountElement.textContent = "0";
                updateHistoryDisplay();
            }
        }
        
        // 事件监听
        drawButton.addEventListener('click', drawRandomNumber);
        resetButton.addEventListener('click', resetDrawHistory);
        
        // 初始显示
        updateHistoryDisplay();
        
        // 添加键盘支持
        document.addEventListener('keydown', function(event) {
            // 空格键抽取
            if (event.code === 'Space') {
                event.preventDefault();
                drawRandomNumber();
            }
            
            // R键重置
            if (event.code === 'KeyR' && event.ctrlKey) {
                event.preventDefault();
                resetDrawHistory();
            }
        });
        
        // 添加页面加载时的动画效果
        window.addEventListener('load', function() {
            document.querySelector('.container').style.opacity = 0;
            document.querySelector('.container').style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                document.querySelector('.container').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                document.querySelector('.container').style.opacity = 1;
                document.querySelector('.container').style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
