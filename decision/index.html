<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机学号抽取器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 36px;
            text-align: center;
        }
        
        .range-info {
            color: #666;
            margin-bottom: 40px;
            font-size: 18px;
            background: #f5f5f5;
            padding: 10px 20px;
            border-radius: 20px;
        }
        
        .result {
            font-size: 140px;
            font-weight: 700;
            color: #2c3e50;
            margin: 40px 0;
            min-height: 160px;
        }
        
        .button {
            background: #3498db;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(52, 152, 219, 0.4);
        }
    </style>
</head>
<body>
    <h1>随机学号抽取器</h1>
    
    <div class="range-info">
        抽取范围：1 - 50号
    </div>
    
    <div class="result" id="result">
        ?
    </div>
    
    <button class="button" id="drawButton">
        抽取随机学号
    </button>

    <script>
        const result = document.getElementById('result');
        const drawButton = document.getElementById('drawButton');
        
        function drawRandomNumber() {
            result.textContent = Math.floor(Math.random() * 50) + 1;
            drawButton.textContent = "再次抽取";
        }
        
        drawButton.addEventListener('click', drawRandomNumber);
    </script>
</body>
</html>
