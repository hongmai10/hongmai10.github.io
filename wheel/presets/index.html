<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>数字转盘 - 随机转盘 | RandomWheelGame</title>
    <meta name="description" content="随机选择1到50的数字"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="canonical" href="https://cn.randomwheelgame.com/presets"/>
    <link rel="icon" href="/favicon.ico"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: #f3f4f6;
            color: #333;
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部样式 */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 1rem;
            height: 3rem;
        }
        
        .header-content {
            max-width: 72rem;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        
        .logo:hover {
            opacity: 0.8;
        }
        
        .logo-icon {
            font-size: 1.25rem;
            color: #fbbf24;
        }
        
        .logo-text {
            font-weight: 600;
            color: #1f2937;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #9ca3af;
        }
        
        .breadcrumb-separator {
            color: #9ca3af;
        }
        
        .breadcrumb-current {
            color: #6b7280;
        }
        
        /* 主要内容区域 */
        main {
            flex: 1;
            max-width: 72rem;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
        }
        
        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .page-title h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .page-title p {
            color: #6b7280;
        }
        
        /* 转盘卡片 */
        .wheel-container {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
        }
        
        .wheel-card {
            background-color: #ffffff;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #e5e7eb;
            width: 16rem;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .wheel-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #fbbf24;
        }
        
        .wheel-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .wheel-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.25rem;
            transition: color 0.2s;
        }
        
        .wheel-card:hover .wheel-title {
            color: #fbbf24;
        }
        
        .wheel-description {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }
        
        .wheel-options {
            font-size: 0.75rem;
            color: #6b7280;
        }
        
        /* 返回按钮 */
        .back-button-container {
            text-align: center;
            margin-top: 3rem;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #fbbf24;
            color: #1f2937;
            font-weight: 700;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        
        .back-button:hover {
            background-color: #f59e0b;
        }
        
        /* 页脚样式 */
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            padding: 3rem 1rem;
            margin-top: auto;
        }
        
        .footer-content {
            max-width: 72rem;
            margin: 0 auto;
        }
        
        .footer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        @media (min-width: 768px) {
            .footer-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .footer-brand {
            display: flex;
            flex-direction: column;
        }
        
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .footer-logo-icon {
            font-size: 1.25rem;
            color: #fbbf24;
        }
        
        .footer-logo-text {
            font-weight: 600;
            color: #ffffff;
        }
        
        .footer-tagline {
            font-size: 0.875rem;
        }
        
        .footer-nav h3 {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        
        .footer-nav ul {
            list-style: none;
        }
        
        .footer-nav li {
            margin-bottom: 0.5rem;
        }
        
        .footer-nav a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        
        .footer-nav a:hover {
            color: #ffffff;
        }
        
        .footer-copyright {
            border-top: 1px solid #374151;
            padding-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
        }
        
        /* 响应式调整 */
        @media (max-width: 640px) {
            .page-title h1 {
                font-size: 1.5rem;
            }
            
            .wheel-card {
                width: 100%;
                max-width: 20rem;
            }
        }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "CollectionPage",
          "@id": "https://cn.randomwheelgame.com/presets#page",
          "name": "数字转盘",
          "description": "随机选择1到50的数字",
          "url": "https://cn.randomwheelgame.com/presets"
        }
      ]
    }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a class="logo" href="https://hongmai10.github.io/wheel">
                        <span class="logo-icon">🎡</span>
                        <span class="logo-text">RandomWheelGame</span>

                    <div class="breadcrumb">

                    <h2 class="wheel-title">数字 1-50</h2>
                    <p class="wheel-description">随机选择1到50的数字</p>
                    <div class="wheel-options">50 选项</div>

        <footer>
            <div class="footer-content">

                    <div class="footer-brand">
                        <div class="footer-logo">
                            <span class="footer-logo-icon">🎡</span>
                            <span class="footer-logo-text">RandomWheelGame</span>

                        <p class="footer-tagline">免费在线随机转盘生成器</p>
                    </div>
                    
                    <nav class="footer-nav" aria-label="产品">

                        <ul>

                <div class="footer-copyright">
                    <p>© 2026 Hongmai10 Class. 保留所有权利。</p>

            </div>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    if (!this.getAttribute('href') || this.getAttribute('href') === '#') {
                        e.preventDefault();
                        window.location.href = 'https://hongmai10.github.io/wheel';
                    }
                });
            });
        });
    </script>
</body>
</html>
