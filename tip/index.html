<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问被拦截</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      font-family: "Microsoft YaHei", "微软雅黑", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      line-height: 1.5;
      color: #000;
    }
    .container {
      width: 580px;
      max-width: 94%;
      border: 2px solid #000;
      padding: 1.8rem 2.5rem;
      background: #fff;
    }
    .icon {
      font-size: 3rem;
      text-align: left;
      margin-bottom: 0.2rem;
      line-height: 1;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      text-align: left;
      margin: 0.5rem 0 1rem 0;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      border-bottom: 1px solid #000;
      padding-bottom: 0.8rem;
    }
    .message {
      background: #f2f2f2;
      padding: 0.8rem 1.2rem;
      border-left: 4px solid #800000;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      color: #000;
      text-align: left;
    }
    .details {
      border: 1px solid #000;
      padding: 0.8rem 1.2rem;
      background: #fff;
      margin-bottom: 1.2rem;
    }
    .row {
      display: flex;
      padding: 0.35rem 0;
      border-bottom: 1px dashed #aaa;
    }
    .row:last-child {
      border-bottom: none;
    }
    .label {
      width: 90px;
      font-weight: 600;
      color: #000;
    }
    .value {
      flex: 1;
      color: #000;
    }
    .footer {
      text-align: left;
      font-size: 0.8rem;
      color: #333;
      border-top: 1px solid #000;
      padding-top: 0.9rem;
    }
    .container, .container * { cursor: default; }
  </style>
</head>
<body>
<div class="container">
  <div class="icon">⛔</div>

  <h1>学校机房已禁止访问该界面</h1>

  <div class="message">
    ⚠️ 当前URL已被限制访问。
  </div>

  <div class="details">
    <div class="row"><span class="label">错误码</span><span class="value">LAB_403_FORBIDDEN</span></div>
    <div class="row"><span class="label">时间戳</span><span class="value" id="timestamp">--</span></div>
    <div class="row"><span class="label">客户端IP</span><span class="value">10.11.12.105</span></div>
    <div class="row"><span class="label">机位号</span><span class="value">3F-A07 / 工作站12</span></div>
    <div class="row"><span class="label">拦截策略</span><span class="value">FILTER-GROUP: LAB-EDU-02</span></div>
    <div class="row"><span class="label">审计ID</span><span class="value">CAMPUS-NET-2025-04-2387</span></div>
  </div>

  <div class="footer">
    珠海市凤凰中学
  </div>
</div>

<script>
  document.getElementById('timestamp').textContent = (function() {
    var d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0') + ' ' +
           String(d.getHours()).padStart(2,'0') + ':' +
           String(d.getMinutes()).padStart(2,'0') + ':' +
           String(d.getSeconds()).padStart(2,'0') + ' CST';
  })();
</script>
</body>
</html>
